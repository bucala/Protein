name: Catalog regression tests

on:
  push:
    branches: ["protein-db"]
  pull_request:
    branches: ["protein-db"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/catalog.test.mjs
